name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Compilación, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew :core:compileKotlin :app:compileDebugKotlin --console=plain

      - name: detekt
        run: ./gradlew detekt --console=plain

      - name: Android lint
        run: ./gradlew lintDebug --console=plain

      - name: Tests unitarios
        run: ./gradlew :core:test :app:testDebugUnitTest --continue --console=plain

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
            core/build/reports/
            core/build/test-results/
          retention-days: 7
