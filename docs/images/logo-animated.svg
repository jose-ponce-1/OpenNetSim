<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="160" height="160" role="img" aria-label="OpenNetSim">
  <!--
    Same paths, colours and timing as the splash screen (app/src/main/res/drawable-v31/splash_icon.xml):
    the frame is drawn (0-520 ms), the left node pops in (200 ms), the pulse runs (240-800 ms) and the
    right node pops in (680 ms). Here it loops every 4 s: animation, pause and fade out.
  -->
  <style>
    .logo { animation: fade 4s infinite; }
    .frame, .pulse { stroke-dasharray: 1; stroke-dashoffset: 1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .frame { stroke: #0067C6; stroke-width: 7.5; animation: draw-frame 4s infinite; }
    .pulse { stroke: #00C4FF; stroke-width: 7; animation: draw-pulse 4s infinite; }
    .dot { fill: #67E8F9; transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .dot-left { animation: pop-left 4s infinite; }
    .dot-right { animation: pop-right 4s infinite; }

    @keyframes fade {
      0%, 88% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    @keyframes draw-frame {
      0% { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      13%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes draw-pulse {
      0%, 6% { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      20%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes pop-left {
      0%, 5% { transform: scale(0); animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      10.6% { transform: scale(1.3); animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      13%, 100% { transform: scale(1); }
    }
    @keyframes pop-right {
      0%, 17% { transform: scale(0); animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      22.6% { transform: scale(1.3); animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      25%, 100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .frame, .pulse, .dot { animation: none; }
      .frame, .pulse { stroke-dashoffset: 0; }
      .dot { transform: scale(1); }
    }
  </style>
  <g class="logo">
    <path class="frame" pathLength="1" d="M 16,42 L 16,30 A 14,14 0 0,1 30,16 L 70,16 A 14,14 0 0,1 84,30 L 84,42" />
    <path class="frame" pathLength="1" d="M 84,58 L 84,70 A 14,14 0 0,1 70,84 L 30,84 A 14,14 0 0,1 16,70 L 16,58" />
    <path class="pulse" pathLength="1" d="M 12,50 L 28,54 L 41,25 L 54,77 L 66,33 L 75,50 L 88,50" />
    <circle class="dot dot-left" cx="12" cy="50" r="5.5" />
    <circle class="dot dot-right" cx="88" cy="50" r="5.5" />
  </g>
</svg>
