schema: spec-driven

# Contexto del proyecto: solo restricciones que no se deducen leyendo el código.
context: |
  Todos los artefactos (proposal, design, specs, tasks) se escriben en español.
  OpenNetSim es una herramienta de QA: nunca debe cambiar en silencio las condiciones de red bajo prueba.
  `core/` es Kotlin puro: sin imports de Android, para probarlo en la JVM.
  Toda medida de tiempo del motor, de los forwarders y del servicio usa el reloj monotónico (`MonotonicClock`), nunca el reloj de pared.
  Prohibido cambiar versiones mayores de AGP, Kotlin, Gradle o Compose sin comprobar antes la matriz de compatibilidad de AGP.
  La puerta de calidad es `compileDebugKotlin`, `detekt`, `lintDebug` y `testDebugUnitTest`; la CI de GitHub Actions la ejecuta en cada push y PR.
  La verificación en dispositivo o emulador es obligatoria para cambios en `service/`.

rules:
  proposal:
    - Escribir en español
    - Indicar siempre el alcance excluido (sección "Fuera de alcance")
  specs:
    - Escribir en español, con las palabras clave SHALL y escenarios GIVEN/WHEN/THEN
  tasks:
    - Cada tarea termina con un criterio "verificar …" ejecutable
